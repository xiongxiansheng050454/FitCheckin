name: Project checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            cloudfunctions/fitcheckin/package-lock.json
      - run: npm ci
      - run: npm ci --prefix cloudfunctions/fitcheckin --ignore-scripts
      - run: npm test
      - run: npm run check
